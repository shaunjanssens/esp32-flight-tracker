; ESP32 Flight Tracker — Waveshare ESP32-S3-Touch-LCD-2.1
;
; The official platformio/espressif32 platform still ships Arduino core 2.0.17,
; but ESP32_Display_Panel 1.0.x needs ESP-IDF 5.x / Arduino core 3.x — hence the
; pioarduino platform fork below.

[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
; ESP32-S3R8: quad SPI flash + octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb_ota.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; native USB CDC — the board has no UART bridge
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I src

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl@^9.5.0
    bblanchon/ArduinoJson@^7.4.3

; Flash over Wi-Fi. This board's USB-serial-JTAG cannot leave ROM download mode
; without a physical power cycle, so after the first cable flash use:
;   pio run -e ota -t upload
[env:ota]
extends = env:device
upload_protocol = espota
upload_port = flighttracker.local
